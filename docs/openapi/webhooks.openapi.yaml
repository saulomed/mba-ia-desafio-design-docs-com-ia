              message: Required
    InvalidIdError:
      summary: id que não é UUID
      value:
        error:
          code: VALIDATION_ERROR
          message: Validation failed
          details:
            - path: id
              message: Invalid uuid
    InvalidPageSizeError:
      summary: pageSize acima de 100
      value:
        error:
          code: VALIDATION_ERROR
          message: Validation failed
          details:
            - path: pageSize
              message: Number must be less than or equal to 100
